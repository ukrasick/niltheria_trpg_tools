name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

# 【追加】ビルドコマンド等をすべて niltheria-tools フォルダ内で実行するように指定
defaults:
  run:
    working-directory: niltheria-tools

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 【修正】package-lock.json の位置をサブフォルダに指定
          cache: 'npm'
          cache-dependency-path: 'niltheria-tools/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 【修正】ビルド後の成果物(dist)のパスもサブフォルダ配下に指定
          path: ./niltheria-tools/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4